name: Build ingestion images

# Builds the worker images and pushes them to the GitHub Container Registry. Deploy
# targets then `docker compose pull` these images instead of building — see
# deploy/README.md.
#
#   tender-ingestion            – all workers (alpine, no browser)   docker/Dockerfile.worker
#   tender-ingestion-documents  – documents worker WITH Chromium      docker/Dockerfile.documents

on:
  push:
    branches: [master, main]
    paths:
      - "lib/**"
      - "messages/**"
      - "data/**"
      - "workers/**"
      - "scripts/**"
      - "docker/Dockerfile.worker"
      - "docker/Dockerfile.documents"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-ingestion-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ghcr.io/bau-ai/bauai-nextjs/tender-ingestion
            dockerfile: docker/Dockerfile.worker
          - image: ghcr.io/bau-ai/bauai-nextjs/tender-ingestion-documents
            dockerfile: docker/Dockerfile.documents
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
