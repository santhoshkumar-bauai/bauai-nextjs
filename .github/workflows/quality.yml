name: Quality

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Build-only placeholders: routes are dynamic and do not connect during build.
      MONGODB_URI: mongodb://build-time-placeholder:27017/bauai
      BETTER_AUTH_SECRET: build-time-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm install is intentional: the Windows-authored lock omits Linux optional binaries.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
