# Local and staging deployment for the tender ingestion workers.
#
# Run from the repository root:
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml logs -f ingest
#
# MongoDB runs as mongodb-atlas-local: a single-member replica set (transactions
# and change streams require one, §6.1) bundled with mongot, so $search and
# $vectorSearch work locally exactly as on Atlas. Production must use a
# three-member set or Atlas.

name: bauai-ingestion

# Only the two connection URLs are set here, and deliberately so: `environment`
# takes precedence over `env_file`, so listing S3 or TED variables here would
# override the real values from .env.local with blanks whenever the host shell does
# not happen to export them. Everything else — credentials, log level, concurrency,
# shadow mode — comes from .env.local unchanged.
#
# These two must be overridden, because .env.local points at localhost while the
# workers reach MongoDB and Redis by compose service name.
# atlas-local advertises itself as "localhost", so in-network clients must use
# directConnection rather than the replica-set name.
x-worker-env: &worker-env
  MONGODB_URI: mongodb://mongo:27017/?directConnection=true
  REDIS_URL: redis://redis:6379

x-worker-base: &worker-base
  build:
    context: ..
    dockerfile: docker/Dockerfile.worker
  image: bauai/tender-ingestion:latest
  restart: unless-stopped
  env_file:
    - path: ../.env.local
      required: false
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
  # SIGTERM starts the graceful drain; the grace period must exceed
  # INGESTION_SHUTDOWN_GRACE_MS so in-flight jobs finish instead of redelivering.
  stop_signal: SIGTERM
  stop_grace_period: 45s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  mongo:
    # Bundles mongod + mongot and self-initiates the replica set, so no init
    # side-car is needed and Atlas Search / Vector Search work locally.
    image: mongodb/mongodb-atlas-local:8.2
    # atlas-local names the replica set after the container hostname; without a
    # pinned hostname, recreating the container generates a new name that no
    # longer matches the stored replset config and the node boots as a GHOST.
    hostname: bauai-mongo
    # Behave like a system service: survive reboots without manual compose up.
    restart: unless-stopped
    # Bounded so a mongot vector-index build cannot starve the whole Docker VM
    # (observed: host-wide Docker wedge during the 44k-notice embedding
    # backfill on a 16GB machine). OOM-killing this container is recoverable —
    # every AI pipeline resumes from its ledger.
    mem_limit: ${MONGO_MEM_LIMIT:-4g}
    volumes:
      - mongo-data:/data/db
      - mongot-data:/data/mongot
    ports:
      # Host access needs directConnection=true. Default host port is 27018
      # because dev machines commonly run their own mongod on 27017.
      - "${MONGO_HOST_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # The queue is durable transport, so persistence stays on; a restart must
      # not lose pending entries that were never acknowledged.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    ports:
      # Host default is 6380: Windows dev machines often run their own Redis
      # (5.x) service on 127.0.0.1:6379, which shadows a docker publish.
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Creates collections, indexes, and source configs, then verifies source access.
  # Every worker waits for this so nothing writes before the unique indexes exist.
  bootstrap:
    <<: *worker-base
    restart: "no"
    environment:
      <<: *worker-env
    command: ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--experimental-strip-types", "scripts/ingestion-bootstrap.mts"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Exactly one replica: leases make more safe, but they add nothing (§4.1).
  scheduler:
    <<: *worker-base
    environment:
      <<: *worker-env
    command: ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--experimental-strip-types", "workers/scheduler.mts"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${SCHEDULER_METRICS_PORT:-9464}:9464"

  # The horizontally scalable tier: `docker compose up -d --scale ingest=4`.
  ingest:
    <<: *worker-base
    environment:
      <<: *worker-env
    command: ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--experimental-strip-types", "workers/ingest.mts"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    deploy:
      replicas: ${INGEST_REPLICAS:-2}

  # Single replica: a second would duplicate every push without adding durability.
  outbox:
    <<: *worker-base
    environment:
      <<: *worker-env
    command: ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--experimental-strip-types", "workers/outbox-relay.mts"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${OUTBOX_METRICS_PORT:-9465}:9464"

  # Downloads tender documents into S3 and extracts their text. Scales horizontally:
  # rows are claimed with a lease, so replicas never collide.
  documents:
    <<: *worker-base
    environment:
      <<: *worker-env
    command:
      ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--experimental-strip-types", "workers/documents.mts"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    deploy:
      replicas: ${DOCUMENT_REPLICAS:-1}

  status:
    <<: *worker-base
    environment:
      <<: *worker-env
    command: ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--experimental-strip-types", "workers/status-updater.mts"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # BullMQ consumers + producers for the AI queues (embedding, chunking).
  ai-indexer:
    <<: *worker-base
    environment:
      <<: *worker-env
    command: ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--experimental-strip-types", "workers/ai-indexer.mts"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${AI_INDEXER_METRICS_PORT:-9466}:9464"

volumes:
  mongo-data:
  mongot-data:
  redis-data:
